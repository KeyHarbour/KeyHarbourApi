---
openapi: 3.0.1
info:
  title: API V2
  version: v2
servers:
- url: https:///api/v2
  description: API Serveur
  variables:
    defaultHost:
      default: https://
components:
  schemas:
    Created:
      type: object
      properties:
        status:
          type: string
          example: accepted
    Updated:
      type: object
      properties:
        status:
          type: string
          example: updated
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
paths:
  "/auth":
    get:
      summary: auth application
      tags:
      - Authentification
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Access granted
        '401':
          description: Unauthorized
  "/workspaces/{workspace_uuid}/keyvalues":
    post:
      summary: Create a new Keyvalue
      tags:
      - Key/Values
      parameters:
      - name: workspace_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Created"
        '422':
          description: Unprocessable Entity
        '401':
          description: Unauthorized
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:
                  type: string
                  example: my-key-123
                value:
                  type: string
                  format: json
                  example: '{"test": true}'
                value_file:
                  type: string
                  format: binary
                expires_at:
                  type: string
                  format: date_time
                private:
                  type: boolean
                one_time_only:
                  type: boolean
              required:
              - key
              oneOf:
              - required:
                - value
              - required:
                - value_file
  "/keyvalues/{key}":
    get:
      summary: Get a specific keyvalue
      tags:
      - Key/Values
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Donnée lue et détruite
        '404':
          description: Not found
        '401':
          description: Unauthorized
    patch:
      summary: Update a specific key_value_store
