name: "CI Pipeline"

on:
  pull_request:
    branches: [ "main" ]


env:
  DATABASE_NAME: ${{ vars.DATABASE_NAME }}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
  RAILS_ENV: test
  MEILI_MASTER_KEY: password123
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432

jobs:
  scan_rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: password123
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        # On attend que Meilisearch réponde sur son endpoint de santé avant de lancer les tests
        options: >-
          --health-cmd="curl -f http://localhost:7700/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare tests
        working-directory: spec/dummy
        run: |
          bundle exec rails db:setup RAILS_ENV=test

      - name: Run test
        run: bundle exec rspec spec

      - name: Generate coverage badge
        run: bin/coverage_badge         


      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage.svg

  coverage:
    name: Add Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [scan_rubocop, tests]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }} 

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: .
          
      - name: Add coverage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          if git diff-index --quiet HEAD -- coverage.svg; then
            echo "Le badge n'a pas changé. Aucun push nécessaire."
          else
            git commit -m "chore: Adding coverage [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi